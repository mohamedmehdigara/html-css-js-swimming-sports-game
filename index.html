<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hydro Dash: Swimming Race</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        :root {
            --pool-blue: #0077b6;
            --water-ripple: #48cae4;
            --swimmer-red: #e63946;
            --swimmer-green: #2a9d8f;
            --lane-white: #f1faee;
            --dark-text: #1d3557;
            --bg-light: #f4f6f9;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-light);
            color: var(--dark-text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .game-container {
            width: 95%;
            max-width: 800px;
            background-color: var(--lane-white);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 2.25rem;
            margin-bottom: 10px;
            color: var(--pool-blue);
        }

        canvas {
            display: block;
            width: 100%;
            border-radius: 12px;
            background-color: var(--pool-blue);
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.2);
            margin-bottom: 15px;
        }

        .game-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .settings-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            margin-bottom: 15px;
        }

        .settings-bar label, .settings-bar select {
            font-weight: 700;
            font-size: 1rem;
            color: var(--dark-text);
        }

        .settings-bar select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 2px solid var(--pool-blue);
            background-color: white;
            appearance: none;
            cursor: pointer;
            outline: none;
        }

        .action-button {
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.1s, transform 0.1s;
            box-shadow: 0 3px 0 rgba(0, 0, 0, 0.2);
        }

        .action-button:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.2);
        }

        .primary-button {
            background-color: var(--swimmer-green);
            color: var(--lane-white);
            flex-grow: 1;
        }
        
        .primary-button:disabled {
            background-color: #aaa;
            cursor: not-allowed;
            box-shadow: 0 0 0 transparent;
        }

        /* Touch/Keyboard Stroke Controls */
        .controls {
            display: flex;
            justify-content: space-around;
            gap: 15px;
            margin-top: 15px;
        }

        .control-button {
            flex-grow: 1;
            padding: 15px 10px;
            font-size: 1.5rem;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.1);
            user-select: none;
        }

        .control-button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.1);
        }

        #buttonA {
            background-color: var(--swimmer-green);
            color: var(--lane-white);
        }
        #buttonL {
            background-color: var(--swimmer-red);
            color: var(--lane-white);
        }

        /* Status & Messages */
        .info-bar {
            background-color: var(--pool-blue);
            color: var(--lane-white);
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        #messageBox {
            font-size: 1.5rem;
            font-weight: 900;
            margin-top: 10px;
            margin-bottom: 20px;
            min-height: 24px; /* Ensure space even when empty */
            color: var(--swimmer-red);
        }

        /* Responsive adjustments */
        @media (min-width: 600px) {
            .touch-controls {
                display: none !important; /* Hide touch controls on desktop */
            }
        }

        @media (max-width: 599px) {
            h1 {
                font-size: 1.75rem;
            }
            .info-bar {
                font-size: 0.9rem;
            }
            .control-button {
                padding: 12px 8px;
                font-size: 1.2rem;
            }
            .settings-bar {
                flex-direction: column;
                gap: 10px;
            }
            .settings-bar select, .action-button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>Hydro Dash</h1>
        
        <div class="game-controls">
            <div class="settings-bar">
                <label for="difficultySelector">CPU Difficulty:</label>
                <select id="difficultySelector">
                    <option value="easy">Easy (1.5 speed)</option>
                    <option value="medium" selected>Medium (2.0 speed)</option>
                    <option value="hard">Hard (2.5 speed)</option>
                </select>
                <button id="startButton" class="action-button primary-button">Start Race</button>
            </div>
        </div>

        <canvas id="gameCanvas" width="800" height="300"></canvas>

        <div id="status"></div>

        <div id="messageBox">Select difficulty and press Start!</div>

        <div class="controls touch-controls">
            <button id="buttonA" class="control-button" disabled>A (Left Stroke)</button>
            <button id="buttonL" class="control-button" disabled>L (Right Stroke)</button>
        </div>
    </div>

    <script>
        // --- Game Setup Variables ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const messageBox = document.getElementById('messageBox');
        const statusDiv = document.getElementById('status');
        const startButton = document.getElementById('startButton');
        const difficultySelector = document.getElementById('difficultySelector');

        const RACE_DISTANCE = 500; // Units to travel
        const LANE_HEIGHT = 100;
        const DRAG_FACTOR = 0.985; // Slow down speed each frame
        const BOOST_AMOUNT = 3.5;  // Speed added per stroke

        let gameRunning = false;
        let lastTimestamp = 0;
        let animationFrameId = null;
        let waterOffset = 0; // For water animation
        let countdownIntervalId = null;

        // Difficulty presets that change the CPU's base speed
        const difficultySettings = {
            'easy': { base: 1.5, variation: 0.6 },
            'medium': { base: 2.0, variation: 0.8 },
            'hard': { base: 2.5, variation: 1.0 }
        };

        // --- COLOR CONSTANTS (for JavaScript use) ---
        // Using explicit hex values as JavaScript cannot directly use CSS var() syntax in style properties.
        const COLOR_SWIMMER_RED = '#e63946';
        const COLOR_SWIMMER_GREEN = '#2a9d8f';
        const COLOR_DARK_TEXT = '#1d3557';
        // ------------------------------------------

        // --- Swimmer Data (Player and CPU) ---
        const swimmers = [
            {
                name: "Player",
                color: COLOR_SWIMMER_RED, // Red
                y: LANE_HEIGHT * 0.5,
                x: 0,
                speed: 0,
                lastStrokeKey: null,
            },
            {
                name: "CPU Champ",
                color: COLOR_SWIMMER_GREEN, // Green
                y: LANE_HEIGHT * 1.5,
                x: 0,
                speed: 0,
                cpuSpeedBase: 2.0, // Default, updated on start
                cpuSpeedVariation: 0.8
            }
        ];

        // --- Core Drawing Functions ---

        function drawBackground() {
            // Draw the water background (main pool color is set via CSS background on canvas)

            // Draw Animated Water Ripples
            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)'; // Light white ripple overlay
            const waveHeight = 8;
            const waveLength = 40;
            waterOffset = (waterOffset + 0.5) % waveLength;

            for (let i = 0; i < canvas.width / waveLength + 2; i++) {
                const x = i * waveLength - waterOffset;

                // Draw wavy ripple for the entire pool surface
                ctx.beginPath();
                ctx.moveTo(x, 0);
                // Simple sine-like approximation for wave tops
                ctx.quadraticCurveTo(x + waveLength / 4, waveHeight, x + waveLength / 2, 0);
                ctx.quadraticCurveTo(x + waveLength * 3 / 4, -waveHeight, x + waveLength, 0);
                
                // Draw a full rectangle underneath the wave tops to cover the whole canvas
                ctx.lineTo(x + waveLength, canvas.height);
                ctx.lineTo(x, canvas.height);
                ctx.closePath();
                ctx.fill();
            }

            // Draw Lane Separators
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)'; 
            ctx.fillRect(0, LANE_HEIGHT, canvas.width, 5); // Middle line

            // Draw Lane Lines (The main lane marker)
            ctx.strokeStyle = '#f1faee';
            ctx.lineWidth = 4;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(0, LANE_HEIGHT * 0.5);
            ctx.lineTo(canvas.width, LANE_HEIGHT * 0.5);
            ctx.moveTo(0, LANE_HEIGHT * 1.5);
            ctx.lineTo(canvas.width, LANE_HEIGHT * 1.5);
            ctx.stroke();
            ctx.setLineDash([]); // Reset line dash

            // Draw Finish Line (right edge)
            ctx.strokeStyle = 'yellow';
            ctx.lineWidth = 10;
            ctx.beginPath();
            ctx.moveTo(canvas.width - 20, 0);
            ctx.lineTo(canvas.width - 20, canvas.height);
            ctx.stroke();
            ctx.lineWidth = 1; // Reset line width
        }

        function drawSwimmer(swimmer) {
            const laneCenterY = swimmer.y + (canvas.height / 3); 
            // Map x position (0 to RACE_DISTANCE) to canvas coordinates (20 to canvas.width - 20)
            const normalizedX = (swimmer.x / RACE_DISTANCE) * (canvas.width - 40) + 20;

            // 0. Draw speed-based ripples behind the swimmer
            const rippleLength = swimmer.speed * 4;
            if (rippleLength > 1) {
                const alpha = Math.min(0.5, swimmer.speed / 10);
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.8})`;
                ctx.beginPath();
                // Simple ellipse for ripple animation
                ctx.ellipse(
                    normalizedX - 10 - (rippleLength / 2), 
                    laneCenterY, 
                    rippleLength, 
                    8, 
                    0, 0, Math.PI * 2
                );
                ctx.fill();
            }

            // 1. Draw the Swimmer Body (Simple circle/head)
            ctx.fillStyle = swimmer.color;
            ctx.beginPath();
            ctx.arc(normalizedX, laneCenterY, 15, 0, Math.PI * 2);
            ctx.fill();

            // 2. Draw 'Goggles' (for visual appeal)
            ctx.fillStyle = '#1d3557';
            ctx.beginPath();
            ctx.arc(normalizedX - 5, laneCenterY - 2, 4, 0, Math.PI * 2);
            ctx.arc(normalizedX + 5, laneCenterY - 2, 4, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawGame() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawBackground();

            swimmers.forEach(drawSwimmer);

            // Update Status Display
            statusDiv.innerHTML = `
                <div class="info-bar">
                    <div style="display: flex; justify-content: space-around;">
                        <span style="color: white;">PLAYER: ${Math.min(100, (swimmers[0].x / RACE_DISTANCE * 100)).toFixed(1)}%</span>
                        <span style="color: white;">CPU: ${Math.min(100, (swimmers[1].x / RACE_DISTANCE * 100)).toFixed(1)}%</span>
                    </div>
                </div>
            `;
        }

        // --- Game Logic Functions ---

        function setControlsEnabled(enabled) {
            document.getElementById('buttonA').disabled = !enabled;
            document.getElementById('buttonL').disabled = !enabled;
            // Only disable start button when the race is running or counting down
            startButton.disabled = enabled;
            difficultySelector.disabled = enabled;
        }

        function handleStroke(key) {
            if (!gameRunning) return;

            const player = swimmers[0];
            const strokeKey = key.toUpperCase();

            // Check for correct alternating stroke
            if (player.lastStrokeKey === null || strokeKey !== player.lastStrokeKey) {
                // Successful stroke!
                player.speed += BOOST_AMOUNT;
                player.lastStrokeKey = strokeKey;
                messageBox.textContent = `Stroke ${strokeKey} successful! Keep Alternating!`;
            } else {
                // Failed non-alternating stroke (penalty or stall)
                player.speed *= 0.7; // Stronger penalty for missed stroke
                messageBox.textContent = `SPLASH! Mistake! Must alternate to the ${player.lastStrokeKey === 'A' ? 'L' : 'A'} stroke!`;
            }

            // Clamp max speed
            player.speed = Math.min(player.speed, 25);
        }

        function updateGame(deltaTime) {
            if (!gameRunning) return;

            const player = swimmers[0];
            const cpu = swimmers[1];
            const timeFactor = deltaTime / 16.6; // Normalize speed based on 60 FPS target

            // 1. Player Update
            player.x += player.speed * timeFactor;
            player.speed *= DRAG_FACTOR; // Apply drag

            // 2. CPU Update
            // CPU speed is based on selected difficulty plus a randomized, smoother variation
            let cpuEffectiveSpeed = cpu.cpuSpeedBase + (Math.sin(Date.now() / 500) * cpu.cpuSpeedVariation);
            cpu.x += cpuEffectiveSpeed * timeFactor;
            
            // Apply slight drag to CPU speed to prevent infinite acceleration, though their speed is mostly defined by base.
            cpu.speed = cpuEffectiveSpeed; 

            // 3. Check for Win Condition
            const winner = swimmers.find(s => s.x >= RACE_DISTANCE);

            if (winner) {
                endGame(winner.name);
            }
        }

        function gameLoop(timestamp) {
            if (!lastTimestamp) lastTimestamp = timestamp;
            const deltaTime = timestamp - lastTimestamp;
            lastTimestamp = timestamp;

            updateGame(deltaTime);
            drawGame();

            if (gameRunning) {
                animationFrameId = requestAnimationFrame(gameLoop);
            }
        }

        function handleCountdown(initialCountdown) {
            let countdown = initialCountdown;
            
            // Disable everything during the countdown
            setControlsEnabled(false);
            startButton.disabled = true;

            messageBox.style.color = COLOR_DARK_TEXT;
            messageBox.textContent = `Starting in ${countdown}...`;

            countdownIntervalId = setInterval(() => {
                countdown--;
                if (countdown > 0) {
                    messageBox.textContent = countdown;
                } else if (countdown === 0) {
                    messageBox.textContent = "GO!!!";
                    messageBox.style.color = COLOR_SWIMMER_RED; // Fixed color reference
                } else {
                    clearInterval(countdownIntervalId);
                    setControlsEnabled(true); // Enable controls after GO!
                    gameRunning = true;
                    lastTimestamp = 0;
                    requestAnimationFrame(gameLoop);
                }
            }, 1000);
        }

        function startGame() {
            // Stop any existing countdown
            if (countdownIntervalId) {
                clearInterval(countdownIntervalId);
            }

            // Reset swimmers
            swimmers[0].x = 0;
            swimmers[0].speed = 0;
            swimmers[0].lastStrokeKey = null;

            swimmers[1].x = 0;
            swimmers[1].speed = 0;

            // Read difficulty setting and apply to CPU
            const selectedDifficulty = difficultySelector.value;
            const settings = difficultySettings[selectedDifficulty];
            swimmers[1].cpuSpeedBase = settings.base;
            swimmers[1].cpuSpeedVariation = settings.variation;

            // Start the countdown sequence
            handleCountdown(3);
        }

        function endGame(winnerName) {
            gameRunning = false;
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }

            if (winnerName === 'Player') {
                messageBox.textContent = "YOU WIN! Fantastic Dash!";
                messageBox.style.color = COLOR_SWIMMER_GREEN; // Fixed color reference
            } else {
                messageBox.textContent = "CPU WINS! Better luck next time!";
                messageBox.style.color = COLOR_SWIMMER_RED; // Fixed color reference
            }
            
            // Update UI for restart
            startButton.textContent = 'Restart Race';
            startButton.disabled = false;
            difficultySelector.disabled = false;
        }

        // --- Event Listeners and Initialization ---

        // 1. Keyboard Input
        document.addEventListener('keydown', (e) => {
            // Only process input if controls are enabled (i.e., after "GO!!!")
            if (startButton.disabled) {
                const key = e.key.toUpperCase();
                if (key === 'A' || key === 'L') {
                    e.preventDefault(); 
                    handleStroke(key);
                }
            }
        });

        // 2. Touch/Mouse Input (for mobile and on-screen buttons)
        document.getElementById('buttonA').addEventListener('click', (e) => {
            e.preventDefault();
            handleStroke('A');
        });

        document.getElementById('buttonL').addEventListener('click', (e) => {
            e.preventDefault();
            handleStroke('L');
        });

        // 3. Start Button
        startButton.addEventListener('click', startGame);

        // 4. Resize Listener for responsiveness
        function resizeCanvas() {
            const container = document.querySelector('.game-container');
            // Calculate width, accounting for padding (20px left/right = 40px total)
            const containerWidth = container.clientWidth - 40; 
            // Cap max width at 800px, otherwise use container width
            canvas.width = containerWidth > 800 ? 800 : containerWidth;
            canvas.height = 300;
            drawGame(); // Redraw initial state
        }

        window.addEventListener('load', () => {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            drawGame(); // Initial draw before race starts
            setControlsEnabled(false); // Initially disable stroke controls
            startButton.disabled = false; // Ensure start button is enabled
        });

    </script>
</body>
</html>
